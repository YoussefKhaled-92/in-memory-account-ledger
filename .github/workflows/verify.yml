name: Verify ledger
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build AccountLedger.slnx -c Release -m:1 -p:UseSharedCompilation=false
      - name: Verify source formatting and explicit imports
        run: dotnet format AccountLedger.slnx --no-restore --verify-no-changes --diagnostics IDE0011 IDE0005
      - name: Run all 53 tests and verify the required design failure
        shell: bash
        run: |
          set +e
          dotnet test AccountLedger.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx" > test-output.txt 2>&1
          result=$?
          set -e
          cat test-output.txt
          test "$result" -eq 1
          python3 scripts/verify-test-results.py tests/Ledger.Tests/TestResults/tests.trx
      - name: Verify exact replay output
        shell: bash
        run: |
          dotnet run --project src/Ledger.Replay -c Release --no-build > replay-output.txt
          cat replay-output.txt
          cmp docs/replay-output.txt replay-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-output
          path: |
            **/TestResults/*.trx
            replay-output.txt
            test-output.txt
